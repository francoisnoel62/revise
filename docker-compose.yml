# ABOUTME: Local MongoDB for development
# ABOUTME: Run with: docker compose up -d

services:
  mongodb:
    image: mongo:7
    container_name: revise-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    # For auth, uncomment:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: admin
    #   MONGO_INITDB_ROOT_PASSWORD: password
    restart: unless-stopped

volumes:
  mongodb_data:
