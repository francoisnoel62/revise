name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run verify
        # npm run verify = lint → unit tests → build
        # Integration tests (test:integration) need MongoDB and are excluded here.
        # E2E tests (test:e2e) need a running server and are excluded here.
